name: Close stale issues

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          only-labels: needs-info
          days-before-stale: 14
          days-before-close: 7
          stale-issue-label: stale
          stale-issue-message: >
            This issue has been waiting for more information for 14 days.
            It will be closed in 7 days if there is no reply. Reply with the details
            and it will stay open.
          close-issue-message: >
            Closing because we did not receive the details we asked for.
            Feel free to reopen with new information.
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-message: >
            This pull request has had no activity for 30 days.
            It will be closed in 14 days if there is no update.
          close-pr-message: >
            Closing due to inactivity. You are welcome to reopen it when you are ready.
          exempt-issue-labels: pinned,accepted,help wanted
          exempt-pr-labels: pinned
